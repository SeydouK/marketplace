spring.application.name=marketplace-backend
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# Profil actif : "default" en local (cette config). Render mettra SPRING_PROFILES_ACTIVE=prod.
server.port=${PORT:8080}

# ── Base de donnees (defauts locaux ; surchargee par application-prod) ────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/marketplace}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:marketplace}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:marketplace}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway : schema + jeu de donnees de demonstration (dev). La prod ne charge que schema.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:flyway/schema,classpath:flyway/dev


jwt.secret=${JWT_SECRET:marketplaceSecretKeyForJwtTokenGeneration2026VeryLongAndSecureKeyForHs512}
jwt.expiration=86400000

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# ── Stockage des fichiers ────────────────────────────────────────────────────
# Provider : "local" (disque, dev), "b2" (Backblaze B2, prod) ou "r2" (Cloudflare R2).
app.storage.provider=${STORAGE_PROVIDER:local}
app.storage.base-dir=${STORAGE_BASE_DIR:${user.home}/marketplace-betail-poc/storage}
# Backblaze B2 (utilise seulement si provider=b2)
app.storage.b2.endpoint=${B2_ENDPOINT:}
app.storage.b2.bucket=${B2_BUCKET:}
app.storage.b2.access-key=${B2_ACCESS_KEY:}
app.storage.b2.secret-key=${B2_SECRET_KEY:}
app.storage.b2.region=${B2_REGION:}
# Cloudflare R2 (utilise seulement si provider=r2)
app.storage.r2.endpoint=${R2_ENDPOINT:}
app.storage.r2.bucket=${R2_BUCKET:}
app.storage.r2.access-key=${R2_ACCESS_KEY:}
app.storage.r2.secret-key=${R2_SECRET_KEY:}
app.storage.r2.region=${R2_REGION:auto}

# ── Paiement GeniusPay ───────────────────────────────────────────────────────
geniuspay.base-url=${GENIUSPAY_BASE_URL:https://pay.genius.ci/api/v1/merchant}
geniuspay.api-key=${GENIUSPAY_API_KEY:}
geniuspay.api-secret=${GENIUSPAY_API_SECRET:}
geniuspay.webhook-secret=${GENIUSPAY_WEBHOOK_SECRET:}
# ID du wallet marchand (UUID), source des versements aux vendeurs. A obtenir via le dashboard GeniusPay.
geniuspay.wallet-id=${GENIUSPAY_WALLET_ID:}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


gemini.api.key=${GEMINI_API_KEY:AQ.Ab8RN6Jw5WpQDuaw2ruh8eQh-FnZzkkMgQkurpCutFoUUEDyVQ}
gemini.api.url=https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash:generateContent


logging.level.com.marketplace=DEBUG
server.error.include-message=always
server.error.include-stacktrace=always
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.client=DEBUG
logging.level.root=INFO

# ── Email ────────────────────────────────────────────────────────────────────
# Provider : "smtp" (local) ou "brevo" (prod). enabled=false desactive l'envoi.
app.mail.provider=${MAIL_PROVIDER:smtp}
app.mail.enabled=${MAIL_ENABLED:true}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:abfly84gmail.com}}
app.mail.from-name=${MAIL_FROM_NAME:BétailMarket}
app.mail.brevo.api-key=${BREVO_API_KEY:}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:abfy84@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.default-encoding=UTF-8

# ── URLs (CORS + liens dans les emails) ──────────────────────────────────────
app.frontend.url=${APP_FRONTEND_URL:http://localhost:4200}
app.backend.url=${APP_BACKEND_URL:http://localhost:8080}

# ── Séquestre / livraison ────────────────────────────────────────────────────
# Délai après lequel un animal déclaré livré libère le versement du vendeur sans
# confirmation de l'acheteur. Un litige ouvert suspend ce décompte.
app.livraison.delai-liberation-jours=${LIVRAISON_DELAI_LIBERATION_JOURS:7}
# Fréquence du balayage qui libère les versements échus (défaut : 1 h).
app.livraison.scan-liberation-ms=${LIVRAISON_SCAN_LIBERATION_MS:3600000}
