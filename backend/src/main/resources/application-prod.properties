# =====================================================================
# Profil PRODUCTION — active via SPRING_PROFILES_ACTIVE=prod (Render).
# Surcharge uniquement ce qui differe de application.properties.
# Toutes les valeurs sensibles proviennent des variables d'environnement.
# =====================================================================

# ── Base de donnees (Neon) — requise, pas de defaut localhost ────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ── JPA ──────────────────────────────────────────────────────────────────────
spring.jpa.show-sql=false

# ── Flyway : structure + jeu de donnees (inclut les comptes admin/veterinaire) ─
spring.flyway.locations=classpath:flyway/schema,classpath:flyway/dev

# ── Stockage : Backblaze B2 par defaut en prod ───────────────────────────────
# Pour basculer plus tard sur Cloudflare R2 : mettre STORAGE_PROVIDER=r2 et
# renseigner les variables R2_* (le bloc R2 ci-dessous est deja pret).
app.storage.provider=${STORAGE_PROVIDER:b2}
app.storage.b2.endpoint=${B2_ENDPOINT:}
app.storage.b2.bucket=${B2_BUCKET:}
app.storage.b2.access-key=${B2_ACCESS_KEY:}
app.storage.b2.secret-key=${B2_SECRET_KEY:}
app.storage.b2.region=${B2_REGION:}
# Cloudflare R2 (inactif tant que STORAGE_PROVIDER reste "b2")
app.storage.r2.bucket=${R2_BUCKET:}
app.storage.r2.access-key=${R2_ACCESS_KEY:}
app.storage.r2.secret-key=${R2_SECRET_KEY:}
app.storage.r2.region=${R2_REGION:auto}
# ── Email : Brevo (API HTTPS) par defaut en prod ─────────────────────────────
app.mail.provider=${MAIL_PROVIDER:brevo}
app.mail.enabled=${MAIL_ENABLED:true}

# ── URLs publiques — requises (pas de fallback localhost en prod) ─────────────
# app.frontend.url alimente la whitelist CORS (origine Netlify autorisee) et les
# liens dans les emails ; app.backend.url sert aux liens de verification.
app.frontend.url=${APP_FRONTEND_URL}
app.backend.url=${APP_BACKEND_URL}

# ── Logs & erreurs durcis ────────────────────────────────────────────────────
logging.level.com.marketplace=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.client=INFO
logging.level.root=INFO
server.error.include-message=never
server.error.include-stacktrace=never
