spring.application.name=marketplace-backend
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/marketplace
spring.datasource.username=marketplace
spring.datasource.password=marketplace

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:flyway/schema,classpath:flyway/dev

spring.mail.host=localhost
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.from=no-reply@marketplace.local

jwt.secret=marketplaceSecretKeyForJwtTokenGeneration2026VeryLongAndSecureKeyForHs512
jwt.expiration=86400000

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

app.storage.base-dir=${user.home}/marketplace-betail-poc

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
