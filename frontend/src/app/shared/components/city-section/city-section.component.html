<section class="mb-12" *ngIf="listings.length > 0">
  <div class="flex items-center justify-between mb-6 px-4 lg:px-8">
    <div class="flex items-center gap-3">
      <h2 class="text-2xl lg:text-3xl font-semibold text-ink">{{ city }}</h2>
      <a routerLink="/annonces" class="text-ink-2 hover:text-ink transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
        </svg>
      </a>
    </div>
  </div>

  <div class="grid grid-cols-1 gap-6 px-4 sm:grid-cols-2 lg:px-8 xl:grid-cols-4">
    <div *ngFor="let listing of listings; trackBy: trackByListing">
      <app-listing-card [listing]="listing"></app-listing-card>
    </div>
  </div>
</section>
