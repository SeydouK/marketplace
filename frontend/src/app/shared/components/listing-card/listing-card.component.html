<a [routerLink]="['/annonces', listing.id]" class="listing-card">
  <div class="listing-card__media">
    <img
      [src]="listing.image || 'https://placehold.co/640x640/f2f4f7/7f1d1d?text=Animal'"
      [alt]="listing.title"
    />

    <button
      type="button"
      class="listing-card__favorite"
      (click)="$event.preventDefault(); $event.stopPropagation()"
      aria-label="Ajouter aux favoris"
    >
      <i class="pi pi-heart" aria-hidden="true"></i>
    </button>

    <span class="listing-card__status">{{ listing.status | titlecase }}</span>
  </div>

  <div class="listing-card__body">
    <div>
      <h3>{{ listing.title }}</h3>
      <p>{{ listing.location }}</p>
    </div>

    <dl class="listing-card__meta">
      <div>
        <dt>Espèce</dt>
        <dd>{{ listing.animalType | titlecase }}</dd>
      </div>
      <div>
        <dt>Quantité</dt>
        <dd>{{ listing.quantity }} tête<span *ngIf="(listing.quantity ?? 0) > 1">s</span></dd>
      </div>
    </dl>

    <div class="listing-card__footer">
      <strong>{{ listing.price | number:'1.0-0' }} FCFA</strong>
      <span>/ dossier</span>
    </div>
  </div>
</a>
