<a [routerLink]="['/annonces', listing.id]" class="group cursor-pointer block">
  <div class="relative aspect-square rounded-xl overflow-hidden mb-3">
    <img
      [src]="listing.image || 'https://placehold.co/640x640/fde2e2/7f1d1d?text=Animal'"
      [alt]="listing.title"
      class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
    />

    <button
      type="button"
      (click)="toggleFavori($event)"
      [title]="isFavori ? 'Retirer des favoris' : 'Ajouter aux favoris'"
      class="absolute top-3 right-3 p-2 hover:scale-110 transition-transform"
    >
      <svg
        class="w-6 h-6 transition-colors"
        [class.fill-none]="!isFavori"
        [class.stroke-white]="!isFavori"
        [class.fill-red-500]="isFavori"
        [class.stroke-red-500]="isFavori"
        style="stroke-width: 2"
        viewBox="0 0 24 24"
      >
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
      </svg>
    </button>

    <div class="absolute bottom-3 left-3 rounded-full bg-white px-3 py-1 text-xs font-semibold text-red-700 shadow-md">
      {{ listing.status | titlecase }}
    </div>
  </div>

  <div class="space-y-1">
    <div class="flex justify-between items-start">
      <h3 class="font-semibold text-gray-900 truncate">{{ listing.title }}</h3>
    </div>
    <p class="text-gray-500 text-sm">{{ listing.location }}</p>
    <p class="text-gray-500 text-sm">{{ listing.animalType | titlecase }}</p>
    <p class="text-gray-500 text-sm">
      {{ listing.quantity }} tête<span *ngIf="(listing.quantity ?? 0) > 1">s</span>
    </p>
    <div class="flex items-baseline gap-1">
      <span class="font-semibold text-gray-900">{{ listing.price | number:'1.0-0' }} FCFA</span>
      <span class="text-gray-500 text-sm">/ dossier</span>
    </div>
  </div>
</a>
