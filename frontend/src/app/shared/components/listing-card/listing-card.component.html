<a [routerLink]="['/annonces', listing.id]" class="group block min-w-0">

  <!-- Photo -->
  <div class="relative aspect-[4/3] overflow-hidden rounded-[14px] bg-muted">
    <img
      [src]="listing.image | visuelAnimal : listing.animalType"
      [alt]="listing.title"
      loading="lazy"
      class="h-full w-full object-cover transition-transform duration-500 ease-out group-hover:scale-[1.035]"
    />

    <!-- Espèce -->
    <span class="absolute left-2.5 top-2.5 rounded-full bg-white/95 px-2.5 py-0.5 text-xs font-semibold leading-5 text-ink shadow-xs">
      {{ listing.animalType | titlecase }}
    </span>

    <!-- Favori -->
    <button
      *ngIf="canFavorite"
      type="button"
      (click)="toggleFavori($event)"
      [title]="isFavori ? 'Retirer des favoris' : 'Ajouter aux favoris'"
      [attr.aria-label]="isFavori ? 'Retirer des favoris' : 'Ajouter aux favoris'"
      [attr.aria-pressed]="isFavori"
      class="absolute right-2.5 top-2.5 z-10 flex h-8 w-8 items-center justify-center rounded-full bg-white/95 shadow-xs transition-transform hover:scale-105 active:scale-95"
    >
      <svg
        class="h-[18px] w-[18px] transition-colors duration-200"
        [class.fill-danger]="isFavori"
        [class.stroke-danger]="isFavori"
        [class.fill-none]="!isFavori"
        [class.stroke-ink]="!isFavori"
        style="stroke-width: 2"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
      </svg>
    </button>
  </div>

  <!-- Informations -->
  <div class="px-0.5 pt-3">
    <div class="flex items-start justify-between gap-2">
      <h3 class="truncate text-[15px] font-semibold leading-snug text-ink group-hover:underline group-hover:underline-offset-[3px]">{{ listing.title }}</h3>
      <span class="mt-0.5 inline-flex shrink-0 items-center gap-1 text-xs font-medium text-brand-700" title="Vendeur vérifié">
        <i class="pi pi-verified text-[11px]"></i>
        Vérifié
      </span>
    </div>

    <p class="mt-0.5 flex min-w-0 items-center gap-1.5 truncate text-[13px] text-ink-2">
      <span class="truncate">{{ listing.location || 'Localisation non renseignée' }}</span>
      <ng-container *ngIf="listing.breed">
        <span aria-hidden="true">·</span>
        <span class="truncate">{{ listing.breed }}</span>
      </ng-container>
    </p>

    <div class="mt-2 flex items-baseline justify-between gap-2">
      <p class="text-base font-bold tracking-[-0.01em] text-ink tabular">
        {{ listing.price | number:'1.0-0' }}<span class="ml-1 text-xs font-semibold text-ink-2">FCFA</span>
      </p>
      <p class="whitespace-nowrap text-[13px] text-ink-3">
        <span *ngIf="listing.quantity">{{ listing.quantity }} tête<span *ngIf="(listing.quantity ?? 0) > 1">s</span></span>
        <span *ngIf="listing.quantity && listing.animalPoids" aria-hidden="true"> · </span>
        <span *ngIf="listing.animalPoids">{{ listing.animalPoids }} kg</span>
      </p>
    </div>
  </div>
</a>
