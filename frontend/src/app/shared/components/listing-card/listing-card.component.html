<a [routerLink]="['/annonces', listing.id]" class="group cursor-pointer block">
  <!-- Photo avec carousel dots -->
  <div class="relative aspect-square rounded-2xl overflow-hidden mb-3 bg-gray-100">
    <img
      [src]="listing.image || 'https://placehold.co/640x640/fff1f2/b91c1c?text=' + (listing.animalType | titlecase)"
      [alt]="listing.title"
      class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 ease-out"
    />

    <!-- Bouton favori -->
    <button
      *ngIf="canFavorite"
      type="button"
      (click)="toggleFavori($event)"
      [title]="isFavori ? 'Retirer des favoris' : 'Ajouter aux favoris'"
      class="absolute top-3 right-3 p-1.5 hover:scale-110 transition-transform z-10"
    >
      <svg
        class="w-6 h-6 drop-shadow transition-all duration-200"
        [class.fill-[#FF385C]]="isFavori"
        [class.stroke-[#FF385C]]="isFavori"
        [class.fill-none]="!isFavori"
        [class.stroke-white]="!isFavori"
        style="stroke-width: 2; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.3))"
        viewBox="0 0 24 24"
      >
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
      </svg>
    </button>

    <!-- Badge espèce -->
    <div class="absolute top-3 left-3 rounded-full bg-white/90 backdrop-blur-sm px-2.5 py-1 text-xs font-semibold text-gray-800 shadow-sm">
      {{ listing.animalType | titlecase }}
    </div>
  </div>

  <!-- Infos -->
  <div class="space-y-0.5 px-0.5">
    <div class="flex justify-between items-start gap-2">
      <h3 class="font-semibold text-gray-900 truncate text-sm leading-snug">{{ listing.title }}</h3>
    </div>
    <p class="text-gray-500 text-sm truncate">{{ listing.location }}</p>
    <p class="text-gray-400 text-sm">{{ listing.quantity }} tête<span *ngIf="(listing.quantity ?? 0) > 1">s</span></p>
    <div class="flex items-baseline gap-1 pt-1">
      <span class="font-semibold text-gray-900 text-sm">{{ listing.price | number:'1.0-0' }} FCFA</span>
      <span class="text-gray-500 text-sm font-normal">/ dossier</span>
    </div>
  </div>
</a>
