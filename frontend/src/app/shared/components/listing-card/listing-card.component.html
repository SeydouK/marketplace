<a [routerLink]="['/annonces', listing.id]"
  class="group block bg-white rounded-3xl border border-[#E7E0D2] shadow-card hover:shadow-card-hover hover:-translate-y-0.5 transition-all duration-200 overflow-hidden">

  <!-- Photo -->
  <div class="relative aspect-[4/3] overflow-hidden bg-[#F6F1E7]">
    <img
      [src]="listing.image || 'https://placehold.co/640x480/F6F1E7/2D6A4F?text=' + (listing.animalType | titlecase)"
      [alt]="listing.title"
      loading="lazy"
      class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 ease-out"
    />

    <!-- Bouton favori -->
    <button
      *ngIf="canFavorite"
      type="button"
      (click)="toggleFavori($event)"
      [title]="isFavori ? 'Retirer des favoris' : 'Ajouter aux favoris'"
      class="absolute top-3 right-3 w-9 h-9 flex items-center justify-center rounded-full bg-white/90 backdrop-blur-sm shadow-sm hover:scale-110 transition-transform z-10"
    >
      <svg
        class="w-5 h-5 transition-all duration-200"
        [class.fill-[#D9342B]]="isFavori"
        [class.stroke-[#D9342B]]="isFavori"
        [class.fill-none]="!isFavori"
        [class.stroke-gray-600]="!isFavori"
        style="stroke-width: 2"
        viewBox="0 0 24 24"
      >
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
      </svg>
    </button>

    <!-- Badge espèce -->
    <div class="absolute top-3 left-3 rounded-full bg-white/95 backdrop-blur-sm px-3 py-1 text-xs font-bold text-[#1B4332] shadow-sm">
      {{ listing.animalType | titlecase }}
    </div>

    <!-- Badge vendeur vérifié -->
    <div class="absolute bottom-3 left-3 inline-flex items-center gap-1.5 rounded-full bg-[#2D6A4F]/95 backdrop-blur-sm px-3 py-1 text-[11px] font-bold text-white shadow-sm">
      <i class="pi pi-verified text-[11px]"></i>
      Vendeur vérifié
    </div>
  </div>

  <!-- Infos -->
  <div class="p-4">
    <h3 class="font-bold text-gray-900 truncate text-[15px] leading-snug">{{ listing.title }}</h3>

    <p class="mt-1.5 flex items-center gap-1.5 text-sm text-gray-500 truncate">
      <i class="pi pi-map-marker text-xs text-[#8B6F55]"></i>
      {{ listing.location || 'Localisation non renseignée' }}
    </p>

    <div class="mt-1 flex items-center gap-3 text-xs text-gray-400">
      <span *ngIf="listing.breed" class="truncate">{{ listing.breed }}</span>
      <span *ngIf="listing.quantity">{{ listing.quantity }} tête<span *ngIf="(listing.quantity ?? 0) > 1">s</span></span>
    </div>

    <div class="mt-3 pt-3 border-t border-[#F0EAD9] flex items-center justify-between gap-2">
      <span class="text-lg font-extrabold text-[#1B4332] whitespace-nowrap">
        {{ listing.price | number:'1.0-0' }} <span class="text-xs font-bold text-[#8B6F55]">FCFA</span>
      </span>
      <span class="inline-flex items-center gap-1.5 rounded-full bg-[#F2F7F3] group-hover:bg-[#2D6A4F] px-4 py-2 text-xs font-bold text-[#2D6A4F] group-hover:text-white transition-colors whitespace-nowrap">
        Voir détails
        <i class="pi pi-arrow-right text-[10px]"></i>
      </span>
    </div>
  </div>
</a>
