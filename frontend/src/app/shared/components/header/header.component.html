<header class="app-header">
  <div class="app-header__bar">
    <a routerLink="/home" class="app-brand" (click)="closeMenu()" aria-label="Accueil BétailMarket">
      <span class="app-brand__mark">BM</span>
      <span class="app-brand__text">BétailMarket</span>
    </a>

    <nav class="app-nav" aria-label="Navigation principale">
      <a routerLink="/home" routerLinkActive="app-nav__link--active" [routerLinkActiveOptions]="{ exact: true }" class="app-nav__link">
        Accueil
      </a>
      <a routerLink="/annonces" routerLinkActive="app-nav__link--active" class="app-nav__link">
        Catalogue
      </a>
      <a *ngIf="isAcheteur" routerLink="/acheteur/mes-achats" routerLinkActive="app-nav__link--active" class="app-nav__link">
        Achats
      </a>
      <a *ngIf="isVendeur" routerLink="/vendeur/mes-annonces" routerLinkActive="app-nav__link--active" class="app-nav__link">
        Ventes
      </a>
      <a *ngIf="isAdmin" routerLink="/admin" routerLinkActive="app-nav__link--active" class="app-nav__link">
        Admin
      </a>
    </nav>

    <div class="app-header__actions">
      <a *ngIf="!currentUser" routerLink="/auth/login" class="ui-button">
        Connexion
      </a>
      <a *ngIf="!currentUser" routerLink="/auth/register" class="ui-button ui-button--primary">
        Créer un compte
      </a>

      <a *ngIf="isAcheteur" routerLink="/devenir-vendeur" class="app-seller-link">
        Devenir vendeur
      </a>

      <div class="app-menu">
        <button
          type="button"
          class="app-menu__trigger"
          (click)="toggleMenu()"
          [attr.aria-expanded]="menuOpen"
          aria-haspopup="menu"
        >
          <span class="app-menu__avatar">{{ currentUser ? currentUserInitial : '?' }}</span>
          <span class="app-menu__meta">
            <strong>{{ currentUser ? (currentUser.name || 'Compte') : 'Invité' }}</strong>
            <small>{{ currentUser ? roleLabel : 'Menu' }}</small>
          </span>
          <i class="pi pi-chevron-down" aria-hidden="true"></i>
        </button>

        <div *ngIf="menuOpen" class="app-menu__panel" role="menu">
          <ng-container *ngTemplateOutlet="dropdownContent"></ng-container>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="isHomePage" class="app-search">
    <button type="button" class="app-search__field" (click)="focusSearch()">
      <span>Recherche</span>
      <strong>{{ searchTerm || 'Ville, race, vendeur...' }}</strong>
    </button>
    <button type="button" class="app-search__field" (click)="focusSearch()">
      <span>Espèce</span>
      <strong>{{ animalFilterLabel || 'Toutes les espèces' }}</strong>
    </button>
    <a routerLink="/annonces" class="app-search__button" aria-label="Explorer le catalogue">
      <i class="pi pi-search" aria-hidden="true"></i>
    </a>
  </div>

  <div *ngIf="isHomePage" class="app-filter-row" aria-label="Filtres rapides">
    <button
      *ngFor="let filter of animalFilters"
      type="button"
      class="app-filter"
      [class.app-filter--active]="animalFilter === filter.value"
      [attr.aria-pressed]="animalFilter === filter.value"
      (click)="setAnimalFilter(filter.value)"
    >
      <img [src]="filter.icon" [alt]="filter.label" />
      <span>{{ filter.label }}</span>
    </button>
  </div>
</header>

<ng-template #dropdownContent>
  <ng-container *ngIf="!currentUser">
    <a routerLink="/annonces" (click)="closeMenu()" class="app-menu__item" role="menuitem">
      Explorer les annonces
    </a>
    <a routerLink="/auth/login" (click)="closeMenu()" class="app-menu__item" role="menuitem">
      Connexion
    </a>
    <a routerLink="/auth/register" (click)="closeMenu()" class="app-menu__item app-menu__item--strong" role="menuitem">
      Inscription
    </a>
  </ng-container>

  <ng-container *ngIf="currentUser">
    <a *ngIf="isAcheteur" routerLink="/acheteur/mes-achats" (click)="closeMenu()" class="app-menu__item" role="menuitem">
      Mes achats
    </a>
    <a *ngIf="isVendeur" routerLink="/vendeur/mes-annonces" (click)="closeMenu()" class="app-menu__item" role="menuitem">
      Mes annonces
    </a>
    <a *ngIf="isVendeur" routerLink="/animaux/mes-animaux" (click)="closeMenu()" class="app-menu__item" role="menuitem">
      Mes animaux
    </a>
    <a *ngIf="isVeterinaire" routerLink="/veterinaire/certificats" (click)="closeMenu()" class="app-menu__item" role="menuitem">
      Certificats sanitaires
    </a>
    <a *ngIf="isAnader" routerLink="/anader/validation" (click)="closeMenu()" class="app-menu__item" role="menuitem">
      Validation éleveurs
    </a>
    <a *ngIf="isAdmin" routerLink="/admin/utilisateurs" (click)="closeMenu()" class="app-menu__item" role="menuitem">
      Utilisateurs
    </a>
    <a routerLink="/profil" (click)="closeMenu()" class="app-menu__item" role="menuitem">
      Profil
    </a>
    <a routerLink="/profil/parametres" (click)="closeMenu()" class="app-menu__item" role="menuitem">
      Paramètres
    </a>
    <button type="button" (click)="logout()" class="app-menu__item app-menu__item--button" role="menuitem">
      Déconnexion
    </button>
  </ng-container>
</ng-template>
