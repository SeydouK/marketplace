<div *ngIf="showEmailBanner" class="status-banner status-banner--warning">
  <div>
    <i class="pi pi-envelope" aria-hidden="true"></i>
    <p>
      <strong>Confirmez votre adresse email</strong>
      <span>Vérifiez votre boîte mail et cliquez sur le lien d'activation.</span>
    </p>
  </div>
  <button type="button" (click)="goToVerifyEmail()">Voir les instructions</button>
</div>

<div *ngIf="showKycBanner" class="status-banner status-banner--brand">
  <div>
    <i class="pi pi-id-card" aria-hidden="true"></i>
    <p>
      <strong>Vérifiez votre identité</strong>
      <span>Obligatoire pour publier des annonces et accéder au tableau de bord.</span>
    </p>
  </div>
  <button type="button" (click)="goToKyc()">Vérifier maintenant</button>
</div>
