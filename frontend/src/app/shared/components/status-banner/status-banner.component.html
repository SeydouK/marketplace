<!-- Bannière email non vérifié -->
<div
  *ngIf="showEmailBanner"
  class="w-full bg-warning-soft border-b border-warning-line px-4 py-3 flex items-center justify-between gap-4"
>
  <div class="flex items-center gap-3">
    <i class="pi pi-envelope text-accent-500"></i>
    <p class="text-sm text-warning">
      <span class="font-medium">Confirmez votre adresse email</span>
      — vérifiez votre boîte mail et cliquez sur le lien d'activation.
    </p>
  </div>
  <button
    (click)="goToVerifyEmail()"
    class="shrink-0 text-xs font-medium text-warning bg-warning-soft hover:bg-accent-100 px-3 py-1.5 rounded-lg transition-colors"
  >
    Voir les instructions
  </button>
</div>

<!-- Bannière KYC non complété -->
<div
  *ngIf="showKycBanner"
  class="w-full bg-danger-soft border-b border-danger-line px-4 py-3 flex items-center justify-between gap-4"
>
  <div class="flex items-center gap-3">
    <i class="pi pi-id-card text-danger"></i>
    <p class="text-sm text-danger">
      <span class="font-medium">Vérifiez votre identité (KYC)</span>
      — obligatoire pour publier des annonces et accéder au tableau de bord.
    </p>
  </div>
  <button
    (click)="goToKyc()"
    class="shrink-0 text-xs font-medium text-danger bg-danger-soft hover:bg-danger-soft px-3 py-1.5 rounded-lg transition-colors"
  >
    Vérifier maintenant
  </button>
</div>
