<!-- acheteur/marketplace/marketplace.component.html -->
<div class="max-w-7xl mx-auto py-6 px-4">
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
    <h1 class="text-2xl font-bold">Marketplace bétail</h1>
    <span class="text-sm text-gray-500">{{ total }} animal(aux) disponibles</span>
  </div>

  <!-- Filtres -->
  <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6 p-4 bg-gray-50 rounded-xl border border-gray-200">

    <div class="flex flex-col gap-1">
      <label class="text-xs font-medium text-gray-600 uppercase">Espèce</label>
      <select [(ngModel)]="filters.species" (change)="search()"
        class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#611a24]">
        <option value="">Toutes</option>
        <option value="BOVIN">Bovins</option>
        <option value="OVIN">Ovins</option>
        <option value="CAPRIN">Caprins</option>
        <option value="PORCIN">Porcins</option>
        <option value="AVICOLE">Avicoles</option>
      </select>
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-xs font-medium text-gray-600 uppercase">Région</label>
      <select [(ngModel)]="filters.region" (change)="search()"
        class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#611a24]">
        <option value="">Toutes</option>
        <option value="ABIDJAN">Abidjan</option>
        <option value="BOUAKE">Bouaké</option>
        <option value="KORHOGO">Korhogo</option>
        <option value="YAMOUSSOUKRO">Yamoussoukro</option>
        <option value="SAN_PEDRO">San-Pédro</option>
      </select>
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-xs font-medium text-gray-600 uppercase">Prix max (FCFA)</label>
      <input type="number" [(ngModel)]="filters.maxPrice" (change)="search()"
        placeholder="ex : 500000"
        class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#611a24]"/>
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-xs font-medium text-gray-600 uppercase">Certifié DSV</label>
      <select [(ngModel)]="filters.certified" (change)="search()"
        class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#611a24]">
        <option value="">Tous</option>
        <option value="true">Certifiés uniquement</option>
      </select>
    </div>

  </div>

  <!-- Résultats -->
  <div *ngIf="loading" class="text-center py-16 text-gray-400">
    <div class="w-8 h-8 border-2 border-[#611a24] border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
    <p class="text-sm">Chargement...</p>
  </div>

  <div *ngIf="!loading && listings.length === 0" class="text-center py-16 text-gray-400">
    <p>Aucun animal ne correspond à vos critères.</p>
    <button (click)="resetFilters()" class="mt-3 text-sm text-[#611a24] underline">
      Réinitialiser les filtres
    </button>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"
    *ngIf="!loading && listings.length > 0">
    <app-listing-card
      *ngFor="let listing of listings"
      [listing]="listing"
      [showBuyButton]="true">
    </app-listing-card>
  </div>

  <!-- Pagination -->
  <div class="flex items-center justify-center gap-3 mt-8" *ngIf="totalPages > 1">
    <button (click)="prevPage()" [disabled]="currentPage === 0"
      class="px-4 py-2 border rounded-lg text-sm disabled:opacity-40 hover:bg-gray-50 transition">
      ← Précédent
    </button>
    <span class="text-sm text-gray-500">{{ currentPage + 1 }} / {{ totalPages }}</span>
    <button (click)="nextPage()" [disabled]="currentPage >= totalPages - 1"
      class="px-4 py-2 border rounded-lg text-sm disabled:opacity-40 hover:bg-gray-50 transition">
      Suivant →
    </button>
  </div>
</div>
