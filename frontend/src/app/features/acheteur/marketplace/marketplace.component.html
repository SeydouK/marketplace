<section class="ui-page ui-stack">
  <header class="ui-header">
    <div>
      <p class="ui-eyebrow">Marketplace</p>
      <h1>Marketplace bétail</h1>
      <p class="ui-copy">{{ total }} animal(aux) disponibles selon les critères courants.</p>
    </div>
  </header>

  <section class="ui-filterbar" aria-label="Filtres marketplace">
    <div class="ui-field">
      <label for="market-species">Espèce</label>
      <select id="market-species" [(ngModel)]="filters.species" (change)="search()">
        <option value="">Toutes</option>
        <option value="BOVIN">Bovins</option>
        <option value="OVIN">Ovins</option>
        <option value="CAPRIN">Caprins</option>
        <option value="PORCIN">Porcins</option>
        <option value="AVICOLE">Avicoles</option>
      </select>
    </div>

    <div class="ui-field">
      <label for="market-region">Région</label>
      <select id="market-region" [(ngModel)]="filters.region" (change)="search()">
        <option value="">Toutes</option>
        <option value="ABIDJAN">Abidjan</option>
        <option value="BOUAKE">Bouaké</option>
        <option value="KORHOGO">Korhogo</option>
        <option value="YAMOUSSOUKRO">Yamoussoukro</option>
        <option value="SAN_PEDRO">San-Pédro</option>
      </select>
    </div>

    <div class="ui-field">
      <label for="market-price">Prix max (FCFA)</label>
      <input id="market-price" type="number" [(ngModel)]="filters.maxPrice" (change)="search()" placeholder="ex : 500000" />
    </div>

    <div class="ui-field">
      <label for="market-certified">Certifié DSV</label>
      <select id="market-certified" [(ngModel)]="filters.certified" (change)="search()">
        <option value="">Tous</option>
        <option value="true">Certifiés uniquement</option>
      </select>
    </div>
  </section>

  <div *ngIf="loading" class="ui-empty">
    <div>
      <span class="ui-spinner mx-auto mb-3"></span>
      <h2>Chargement du catalogue</h2>
    </div>
  </div>

  <div *ngIf="!loading && listings.length === 0" class="ui-empty">
    <div>
      <h2>Aucun animal trouvé</h2>
      <p>Aucun dossier ne correspond aux critères sélectionnés.</p>
      <button type="button" (click)="resetFilters()" class="ui-button ui-button--primary mt-4">
        Réinitialiser les filtres
      </button>
    </div>
  </div>

  <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4" *ngIf="!loading && listings.length > 0">
    <app-listing-card
      *ngFor="let listing of listings"
      [listing]="listing"
      [showBuyButton]="true"
    ></app-listing-card>
  </div>

  <nav class="flex items-center justify-center gap-3" *ngIf="totalPages > 1" aria-label="Pagination marketplace">
    <button type="button" (click)="prevPage()" [disabled]="currentPage === 0" class="ui-button">
      Précédent
    </button>
    <span class="text-sm text-gray-500">{{ currentPage + 1 }} / {{ totalPages }}</span>
    <button type="button" (click)="nextPage()" [disabled]="currentPage >= totalPages - 1" class="ui-button">
      Suivant
    </button>
  </nav>
</section>
