<!-- admin/gestion-litiges/gestion-litiges.component.html -->
<div class="max-w-7xl mx-auto py-6 px-4">
  <h1 class="page-title mb-6">Litiges &amp; arbitrage escrow</h1>

  <div *ngIf="disputes.length === 0" class="text-center py-16 text-ink-3">
    <p>Aucun litige ouvert.</p>
  </div>

  <div class="space-y-4">
    <div *ngFor="let dispute of disputes"
      class="rounded-xl border border-danger-line bg-white p-5">

      <div class="flex flex-col sm:flex-row sm:items-start gap-4">
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 mb-1">
            <span class="font-semibold text-ink">{{ dispute.animalName }}</span>
            <span class="text-xs px-2 py-0.5 rounded-full bg-danger-soft text-danger font-medium">
              Litige ouvert
            </span>
          </div>
          <p class="text-sm text-ink-3">
            Acheteur : {{ dispute.buyerName }} · Vendeur : {{ dispute.sellerName }}
          </p>
          <p class="text-sm font-semibold text-brand-600 mt-1">
            {{ dispute.amount | number }} FCFA en séquestre
          </p>
          <p class="text-sm text-ink-2 mt-2 bg-canvas rounded-lg p-3 border border-line">
            <span class="font-medium">Motif :</span> {{ dispute.disputeReason }}
          </p>
        </div>

        <div class="shrink-0 flex flex-col gap-2">
          <button (click)="releaseFunds(dispute)"
            class="px-4 py-2 bg-brand-600 text-white text-sm rounded-lg hover:bg-brand-700 transition font-medium">
            Libérer fonds → Vendeur
          </button>
          <button (click)="refundBuyer(dispute)"
            class="px-4 py-2 bg-brand-600 text-white text-sm rounded-lg hover:bg-brand-700 transition font-medium">
            Rembourser → Acheteur
          </button>
        </div>
      </div>

    </div>
  </div>
</div>
