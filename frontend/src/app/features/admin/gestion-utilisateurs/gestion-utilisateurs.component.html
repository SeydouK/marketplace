<!-- admin/gestion-utilisateurs/gestion-utilisateurs.component.html -->
<div class="max-w-7xl mx-auto py-6 px-4">
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
    <h1 class="text-2xl font-bold">Utilisateurs</h1>
    <!-- Filtre rapide -->
    <div class="flex gap-2">
      <button
        *ngFor="let f of filters"
        (click)="setFilter(f.value)"
        [class.bg-[#611a24]]="activeFilter === f.value"
        [class.text-white]="activeFilter === f.value"
        class="px-4 py-2 rounded-lg text-sm border border-[#611a24]/30 hover:bg-[#611a24]/10 transition">
        {{ f.label }}
      </button>
    </div>
  </div>

  <div class="overflow-x-auto rounded-xl border border-gray-200">
    <table class="w-full text-sm">
      <thead class="bg-gray-50 text-gray-600 uppercase text-xs">
        <tr>
          <th class="px-4 py-3 text-left">Nom</th>
          <th class="px-4 py-3 text-left">Email</th>
          <th class="px-4 py-3 text-left">Rôle</th>
          <th class="px-4 py-3 text-left">KYC</th>
          <th class="px-4 py-3 text-left">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100">
        <tr *ngFor="let user of users" class="hover:bg-gray-50 transition">
          <td class="px-4 py-3 font-medium">{{ user.name }}</td>
          <td class="px-4 py-3 text-gray-500">{{ user.email }}</td>
          <td class="px-4 py-3">
            <span class="px-2 py-1 rounded-full text-xs font-medium"
              [ngClass]="getRoleBadgeClass(user.role)">
              {{ user.role }}
            </span>
          </td>
          <td class="px-4 py-3">
            <span class="px-2 py-1 rounded-full text-xs font-medium"
              [ngClass]="getKycBadgeClass(user.kycStatus)">
              {{ user.kycStatus || 'N/A' }}
            </span>
          </td>
          <td class="px-4 py-3">
            <div class="flex gap-2">
              <button
                *ngIf="user.kycStatus === 'PENDING'"
                (click)="validateKyc(user)"
                class="text-xs px-3 py-1 bg-green-600 text-white rounded-lg hover:bg-green-700 transition">
                Valider KYC
              </button>
              <button
                *ngIf="user.kycStatus === 'PENDING'"
                (click)="rejectKyc(user)"
                class="text-xs px-3 py-1 bg-red-600 text-white rounded-lg hover:bg-red-700 transition">
                Rejeter
              </button>
              <button
                (click)="changeRole(user)"
                class="text-xs px-3 py-1 border border-gray-300 rounded-lg hover:bg-gray-100 transition">
                Changer rôle
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div class="flex items-center justify-between mt-4 text-sm text-gray-500" *ngIf="totalPages > 1">
    <span>Page {{ currentPage + 1 }} / {{ totalPages }}</span>
    <div class="flex gap-2">
      <button (click)="prevPage()" [disabled]="currentPage === 0"
        class="px-3 py-1 border rounded-lg disabled:opacity-40 hover:bg-gray-50 transition">
        Précédent
      </button>
      <button (click)="nextPage()" [disabled]="currentPage >= totalPages - 1"
        class="px-3 py-1 border rounded-lg disabled:opacity-40 hover:bg-gray-50 transition">
        Suivant
      </button>
    </div>
  </div>
</div>
