<!-- anader/validation-eleveurs/validation-eleveurs.component.html -->
<div class="max-w-7xl mx-auto py-6 px-4">
  <div class="flex items-center justify-between mb-6">
    <h1 class="page-title">Validation des éleveurs</h1>
    <span class="text-sm text-ink-3">{{ farmers.length }} dossier(s) en attente</span>
  </div>

  <div *ngIf="farmers.length === 0" class="text-center py-16 text-ink-3">
    <svg class="w-12 h-12 mx-auto mb-3 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>
    <p>Aucun éleveur en attente de validation.</p>
  </div>

  <div class="space-y-4" *ngIf="farmers.length > 0">
    <div *ngFor="let farmer of farmers"
      class="rounded-xl border border-line bg-white p-5 flex flex-col sm:flex-row sm:items-center gap-4">

      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2 mb-1">
          <span class="font-semibold text-ink">{{ farmer.name }}</span>
          <span class="text-xs px-2 py-0.5 rounded-full bg-warning-soft text-warning">
            {{ farmer.zone }}
          </span>
        </div>
        <p class="text-sm text-ink-3">{{ farmer.phone }}</p>
        <p class="text-sm text-ink-3 mt-1">
          {{ farmer.animalsCount }} animal(aux) · Soumis le {{ farmer.submittedAt | date:'dd/MM/yyyy' }}
        </p>
      </div>

      <div class="flex gap-2 shrink-0">
        <button (click)="validate(farmer)"
          class="px-4 py-2 bg-brand-600 text-white text-sm rounded-lg hover:bg-brand-700 transition font-medium">
          Valider
        </button>
        <button (click)="reject(farmer)"
          class="px-4 py-2 bg-danger text-white text-sm rounded-lg hover:bg-[#9A2F25] transition font-medium">
          Rejeter
        </button>
      </div>
    </div>
  </div>
</div>
