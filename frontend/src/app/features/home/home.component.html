<main class="ui-page ui-page--wide ui-stack">
  <header class="ui-header">
    <div>
      <p class="ui-eyebrow">Catalogue public</p>
      <h1>Animaux disponibles</h1>
      <p class="ui-copy">
        {{ filteredListings.length }} animal<span *ngIf="filteredListings.length > 1">aux</span>
        disponible<span *ngIf="filteredListings.length > 1">s</span>
      </p>
    </div>

    <a routerLink="/annonces" class="ui-button">
      Voir toutes les annonces
      <i class="pi pi-arrow-right" aria-hidden="true"></i>
    </a>
  </header>

  <section>
    <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3 2xl:grid-cols-4" *ngIf="filteredListings.length; else emptyState">
      <app-listing-card
        *ngFor="let listing of filteredListings; trackBy: trackByListing"
        [listing]="listing"
      ></app-listing-card>
    </div>

    <ng-template #emptyState>
      <div class="ui-empty">
        <div>
          <h2>Aucun animal disponible</h2>
          <p>Essayez de modifier la recherche ou les filtres depuis l'en-tête.</p>
        </div>
      </div>
    </ng-template>
  </section>
</main>
