<main class="flex-1 overflow-auto bg-white">
  <div class="max-w-[2520px] mx-auto py-8 px-4 lg:px-8">
    <section>
      <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4 mb-8">
        <div>
          <h1 class="text-2xl lg:text-3xl font-semibold text-gray-900">Annonces a la une</h1>
          <p class="text-gray-500 mt-2">
            {{ filteredListings.length }} annonce<span *ngIf="filteredListings.length > 1">s</span> disponible<span *ngIf="filteredListings.length > 1">s</span>
          </p>
        </div>

        <a
          routerLink="/annonces"
          class="inline-flex items-center gap-2 rounded-full border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:border-gray-900 hover:text-gray-900 transition-colors"
        >
          Voir toutes les annonces
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </a>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-6" *ngIf="filteredListings.length; else emptyState">
        <app-listing-card
          *ngFor="let listing of filteredListings; trackBy: trackByListing"
          [listing]="listing"
        ></app-listing-card>
      </div>

      <ng-template #emptyState>
        <div class="rounded-[2rem] border border-dashed border-gray-300 bg-white p-10 text-center text-gray-500">
          <h2 class="text-xl font-semibold text-gray-900 mb-2">Aucune annonce trouvee</h2>
          <p>Essaie de modifier la recherche ou les filtres depuis l'en-tete.</p>
        </div>
      </ng-template>
    </section>
  </div>
</main>
