<!-- app.component.html -->
<app-header *ngIf="showHeader"></app-header>
<app-status-banner></app-status-banner>
<p-toast></p-toast>
<app-loader></app-loader>
<main class="app-main" [class.pb-20]="showHeader">
  <router-outlet></router-outlet>
</main>
<app-footer></app-footer>

<!-- Bottom nav mobile — visible uniquement sur les pages publiques -->
<nav *ngIf="showHeader"
  class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-40 pb-safe">
  <div class="flex items-center justify-around px-2 py-2">

    <a routerLink="/" routerLinkActive="text-[#FF385C]" [routerLinkActiveOptions]="{exact: true}"
      class="flex flex-col items-center gap-1 px-3 py-1 min-w-[56px] text-gray-500">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
      <span class="text-[10px] font-medium">Explorer</span>
    </a>

    <a routerLink="/favoris" routerLinkActive="text-[#FF385C]"
      class="flex flex-col items-center gap-1 px-3 py-1 min-w-[56px] text-gray-500">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
      </svg>
      <span class="text-[10px] font-medium">Favoris</span>
    </a>

    <a routerLink="/annonces" routerLinkActive="text-[#FF385C]"
      class="flex flex-col items-center gap-1 px-3 py-1 min-w-[56px] text-gray-500">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2"/>
      </svg>
      <span class="text-[10px] font-medium">Annonces</span>
    </a>

    <a routerLink="/messages" routerLinkActive="text-[#FF385C]"
      class="relative flex flex-col items-center gap-1 px-3 py-1 min-w-[56px] text-gray-500">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
      </svg>
      <span class="absolute top-0 right-2 w-2 h-2 bg-[#FF385C] rounded-full border border-white"></span>
      <span class="text-[10px] font-medium">Messages</span>
    </a>

    <a routerLink="/profil" routerLinkActive="text-[#FF385C]"
      class="flex flex-col items-center gap-1 px-3 py-1 min-w-[56px] text-gray-500">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
      </svg>
      <span class="text-[10px] font-medium">Profil</span>
    </a>

  </div>
</nav>
