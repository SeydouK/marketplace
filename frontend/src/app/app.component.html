<!-- app.component.html -->

<!-- Header desktop : toujours visible si showHeader -->
<div class="hidden md:block">
  <app-header *ngIf="showHeader"></app-header>
</div>

<!-- Header mobile : caché sur les routes isMobileNoNav -->
<div class="md:hidden" *ngIf="showHeader && !isMobileNoNav">
  <app-header></app-header>
</div>

<!-- Nouvelle version telechargee. On ne recharge pas dans le dos de
     l'utilisateur : le faire pendant une saisie de code de remise lui ferait
     perdre ce qu'il tape. -->
<div *ngIf="pwa.majPrete$ | async"
  class="fixed bottom-24 md:bottom-6 left-1/2 -translate-x-1/2 z-[1500] flex items-center gap-3 px-4 py-3 bg-[#1B4332] text-white rounded-2xl shadow-2xl max-w-[calc(100vw-2rem)]">
  <i class="pi pi-sync text-lg flex-shrink-0"></i>
  <p class="text-sm font-semibold">Une nouvelle version est prête.</p>
  <button type="button" (click)="pwa.appliquerMaj()"
    class="flex-shrink-0 px-3 py-1.5 bg-white text-[#1B4332] text-xs font-bold rounded-lg">
    Mettre à jour
  </button>
</div>

<app-status-banner></app-status-banner>
<p-toast></p-toast>
<app-loader></app-loader>
<app-seller-request-modal></app-seller-request-modal>

<main class="app-main" [class.pb-20]="showHeader && !isMobileNoNav">
  <router-outlet></router-outlet>
</main>

<!-- Footer : caché sur mobile -->
<div class="hidden md:block">
  <app-footer></app-footer>
</div>

<!-- Navigation mobile : un bouton "Menu" qui propose les destinations du rôle connecté -->
<app-mobile-nav *ngIf="showHeader && !isMobileNoNav"></app-mobile-nav>
