<!-- app.component.html -->

<!-- Header desktop : toujours visible si showHeader -->
<div class="hidden md:block">
  <app-header *ngIf="showHeader"></app-header>
</div>

<!-- Header mobile : caché sur les routes isMobileNoNav -->
<div class="md:hidden" *ngIf="showHeader && !isMobileNoNav">
  <app-header></app-header>
</div>

<app-status-banner></app-status-banner>
<p-toast></p-toast>
<app-loader></app-loader>
<app-seller-request-modal></app-seller-request-modal>

<main class="app-main" [class.pb-20]="showHeader && !isMobileNoNav">
  <router-outlet></router-outlet>
</main>

<!-- Footer : caché sur mobile -->
<div class="hidden md:block">
  <app-footer></app-footer>
</div>

<!-- Bottom nav mobile -->
<nav *ngIf="showHeader && !isMobileNoNav"
  class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-[#E7E0D2] z-40 pb-safe">
  <div class="flex items-center justify-around px-2 py-2">

    <!-- Explorer -->
    <a routerLink="/" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}"
      class="nav-item flex flex-col items-center gap-1 px-3 py-1 min-w-[56px] text-gray-500">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
      <span class="text-[10px] font-medium">Explorer</span>
    </a>

    <!-- Favoris -->
    <a *ngIf="isLoggedIn && !isAnaderOrVet" routerLink="/favoris" routerLinkActive="active-link"
      class="nav-item flex flex-col items-center gap-1 px-3 py-1 min-w-[56px] text-gray-500">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
      </svg>
      <span class="text-[10px] font-medium">Favoris</span>
    </a>

    <!-- Panier (acheteur et vendeur) -->
    <a *ngIf="isLoggedIn && (isAcheteur || isVendeur)"
      routerLink="/panier" routerLinkActive="active-link"
      class="nav-item relative flex flex-col items-center gap-1 px-3 py-1 min-w-[56px] text-gray-500">
      <div class="relative">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
        </svg>
        <span *ngIf="(panierCount$ | async)! > 0"
          class="absolute -top-2 -right-2 min-w-[16px] h-4 bg-[#2D6A4F] text-white text-[9px] font-bold rounded-full flex items-center justify-center px-0.5 border border-white leading-none">
          {{ panierCount$ | async }}
        </span>
      </div>
      <span class="text-[10px] font-medium">Panier</span>
    </a>

    <!-- Annonces -->
    <a *ngIf="isLoggedIn" routerLink="/annonces" routerLinkActive="active-link"
      class="nav-item flex flex-col items-center gap-1 px-3 py-1 min-w-[56px] text-gray-500">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2"/>
      </svg>
      <span class="text-[10px] font-medium">Annonces</span>
    </a>

    <!-- Messages -->
    <a *ngIf="isLoggedIn" routerLink="/messages" routerLinkActive="active-link"
      class="nav-item relative flex flex-col items-center gap-1 px-3 py-1 min-w-[56px] text-gray-500">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
      </svg>
      <span class="absolute top-0 right-2 w-2 h-2 bg-[#2D6A4F] rounded-full border border-white"></span>
      <span class="text-[10px] font-medium">Messages</span>
    </a>

    <!-- Profil -->
    <a *ngIf="isLoggedIn" routerLink="/profil" routerLinkActive="active-link"
      class="nav-item flex flex-col items-center gap-1 px-3 py-1 min-w-[56px] text-gray-500">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
      </svg>
      <span class="text-[10px] font-medium">Profil</span>
    </a>

    <!-- Connexion (non connecté) -->
    <a *ngIf="!isLoggedIn" routerLink="/auth/login" routerLinkActive="active-link"
      class="nav-item flex flex-col items-center gap-1 px-3 py-1 min-w-[56px] text-gray-500">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
      </svg>
      <span class="text-[10px] font-medium">Connexion</span>
    </a>

  </div>
</nav>
